name: Release

# Push a tag like v2.0.0 (matching module.json) to publish a GitHub Release with
# faction-standing.zip and module.json attached. Foundry installs and updates
# from the releases/latest/download/module.json URL in module.json.
# With the FOUNDRY_RELEASE_TOKEN secret set, the version is also registered on
# the foundryvtt.com package page.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # OIDC identity for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check tag matches module.json and package.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module_version="$(node -p "require('./module.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if ! [[ "$module_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::module.json version '$module_version' is not valid semver"; exit 1
          fi
          if [[ "$TAG" != "v$module_version" || "$module_version" != "$package_version" ]]; then
            echo "::error::tag $TAG, module.json $module_version and package.json $package_version must agree"; exit 1
          fi

      - name: Install dependencies
        run: if [[ -f package-lock.json ]]; then npm ci; else npm install; fi

      - run: npm run check

      - name: Package
        run: cd dist && zip -r ../faction-standing.zip .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: faction-standing.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release made by hand in the GitHub UI for this tag gets the files attached
        # instead of failing the run.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" faction-standing.zip dist/module.json --clobber
          else
            gh release create "$TAG" faction-standing.zip dist/module.json --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Publish on foundryvtt.com
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node tools/foundry-release.mjs
